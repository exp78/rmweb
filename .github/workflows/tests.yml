name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host suites need no reMarkable SDK, device, WPE engine, or live phone.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build qt6-base-dev python3 openssl shellcheck
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/passkey-acceptance/package-lock.json
      - name: Install passkey test dependencies
        run: npm ci --prefix tools/passkey-acceptance
      - name: Run host tests
        run: bash scripts/run-tests.sh
