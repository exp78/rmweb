# Mesa software-GL recipe (part of the llvmpipe/softpipe Mesa build) — TRACKED in git
# (moved out of the gitignored build/src/). Referenced by engine/build-mesa.sh,
# engine/mesa-llvmpipe.incontainer.sh and scripts/build-wpe.sh (libwpe build).
#
# Native file for building Mesa as a NATIVE aarch64 build inside the
# rmweb-sdk container (which IS aarch64, with the reMarkable target sysroot).
# The SDK cross-gcc produces aarch64 binaries that run natively here, so we
# treat target == build and do a normal native build. This avoids meson's
# cross exe_wrapper machinery (the OE cross-file sets needs_exe_wrapper=true).
#
# CC/SDKTARGETSYSROOT etc. come from sourcing the SDK environment-setup script.
# We re-specify the compiler + sysroot flags explicitly so they apply to the
# "native" (= only) toolchain meson sees.

[binaries]
c     = ['aarch64-remarkable-linux-gcc', '-mcpu=cortex-a53+crc+crypto', '-mbranch-protection=standard', '--sysroot=/opt/rmpp-sdk/sysroots/cortexa53-crypto-remarkable-linux']
cpp   = ['aarch64-remarkable-linux-g++', '-mcpu=cortex-a53+crc+crypto', '-mbranch-protection=standard', '--sysroot=/opt/rmpp-sdk/sysroots/cortexa53-crypto-remarkable-linux']
ar    = 'aarch64-remarkable-linux-ar'
nm    = 'aarch64-remarkable-linux-nm'
strip = 'aarch64-remarkable-linux-strip'
ld    = 'aarch64-remarkable-linux-ld'
pkg-config = 'pkg-config'
# host tools used during the Mesa build
flex  = 'flex'
bison = 'bison'

[built-in options]
c_args       = ['-O2', '-pipe']
cpp_args     = ['-O2', '-pipe']
c_link_args  = ['-Wl,-O1', '-Wl,--hash-style=gnu']
cpp_link_args= ['-Wl,-O1', '-Wl,--hash-style=gnu']

[properties]
sys_root = '/opt/rmpp-sdk/sysroots/cortexa53-crypto-remarkable-linux'
